events {
    worker_connections 1024;  # The number of connections each worker process can handle.
    use epoll;                 # Efficient connection method for Linux.
    multi_accept on;           # Accept as many connections as possible.
}

http {
    # Enable file caching.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Connection timeout settings.
    keepalive_timeout 120;

    # Size limits for the types hash tables.
    types_hash_max_size 2048;

    # MIME type settings.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cache settings for static files.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Disable server tokens to hide nginx version.
    server_tokens off;

    # Limits the maximum allowed size of the client request body.
    client_max_body_size 16M;

    server {
        listen 80;

        # Basic status page accessible at http://your-server-address/status
        # Restrict access to localhost for security reasons
        location /status {
            stub_status on;
            allow 127.0.0.1;  # allow access from localhost
            deny all;         # deny access to anyone else
        }

        location / {
            proxy_pass http://appserver:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
        }
    }
}